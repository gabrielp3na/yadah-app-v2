<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Yadah Radio 3D Flota</title>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- MQTT WebSockets -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #login-screen {
      position: fixed;
      inset: 0;
      background: #0b0f19;
      z-index: 4000;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .login-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .login-header h1 {
      color: #38bdf8;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .login-header p {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .grid-units {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
      padding-bottom: 30px;
    }

    .btn-unit-select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 6px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-unit-select.modulador {
      grid-column: span 2;
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #dbeafe;
      font-size: 1rem;
    }

    .btn-unit-select:active {
      background: #38bdf8;
      color: #0b0f19;
    }

    header {
      background-color: #111827;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      z-index: 1000;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      align-items: center;
    }

    .btn-header {
      background: #1f2937;
      border: 1px solid #374151;
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #map-container {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-color: #0f172a;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .btn-sos {
      position: absolute;
      bottom: 20px;
      left: 14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 3px solid #f87171;
      color: #ffffff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.7);
      cursor: pointer;
      z-index: 2500;
    }

    .controls-panel {
      background-color: #111827;
      padding: 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #1f2937;
      z-index: 1000;
      flex-shrink: 0;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .status-active { color: #38bdf8; font-weight: 600; }
    .status-warning { color: #ef4444; font-weight: 700; }

    .channel-status {
      background-color: #030712;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #94a3b8;
      border: 1px solid #1f2937;
    }

    .btn-ptt {
      width: 100%;
      height: 54px;
      background-color: #030712;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    /* ===== ESTILO UNIFICADO ===== */
    .yb-notify-card, .yc-card {
      width: 100%; box-sizing: border-box;
      background: rgba(8, 47, 73, 0.90);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      border-radius: 8px; padding: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
      color: #38bdf8; flex: 0 0 auto; transition: all 0.2s ease; border: 1.5px solid #38bdf8;
    }
    .yb-notify-card.pending, .yc-card.pending { border-color: #38bdf8; }
    .yb-notify-card.accepted, .yc-card.done { border-color: #38bdf8; background: rgba(12, 74, 110, 0.95); }
    .yc-card.active { border-color: #f59e0b; background: rgba(28, 20, 5, 0.95); }

    .yb-notify-title, .yc-state { font-weight: 900; color: #38bdf8 !important; font-size: .64rem; line-height: 1.05; }
    .yb-notify-place, .yc-place { font-size: .76rem; font-weight: 900; margin: 3px 0; color: #e0f2fe !important; line-height: 1.05; overflow-wrap: anywhere; }
    .yb-notify-meta, .yc-time { font-size: .54rem; color: #7dd3fc !important; line-height: 1.1; }

    .yb-notify-actions { display: flex; gap: 4px; margin-top: 5px; }
    .yb-notify-actions button, .yb-notify-finish, .yc-card button {
      width: 100%; border: 1px solid #38bdf8 !important; border-radius: 6px; padding: 6px;
      background: #030712 !important; color: #38bdf8 !important; font-weight: 900; font-size: .64rem; min-height: 28px; cursor: pointer;
    }
    .yb-notify-reject, .yc-card button.cancel { background: #030712 !important; color: #94a3b8 !important; border: 1px solid #334155 !important; }

    /* ===== PESTAÑA DERECHA: BASE ===== */
    #yadah-base-notifications{
      --base-panel-width:min(320px,86vw);
      position:fixed;right:calc(-1 * var(--base-panel-width));left:auto;top:var(--base-tab-top,50%);transform:translateY(-50%);
      z-index:3925;width:var(--base-panel-width);max-height:48vh;overflow-y:auto;overflow-x:hidden;
      box-sizing:border-box;padding:7px;background:#05070B;border:1px solid #22d3ee;
      border-right:0;border-radius:12px 0 0 12px;box-shadow:-8px 8px 24px rgba(0,0,0,.45);
      display:flex;flex-direction:column;gap:5px;transition:right .25s ease;
    }
    #yadah-base-notifications.open{right:0;left:auto}
    #yadah-base-notifications::before{content:'🏠 CARRERAS DE BASE';display:block;color:#fff;font-weight:900;font-size:.78rem;padding:2px 3px 5px;border-bottom:1px solid #164e63;text-align:right}
    
    #yadah-base-tab{
      position:fixed;right:0;left:auto;top:var(--base-tab-top,50%);transform:translateY(-50%);
      z-index:3927;width:48px;min-height:112px;border:0;border-radius:12px 0 0 12px;
      background:rgba(5,7,11,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
      color:#fff;box-shadow:-4px 4px 12px rgba(0,0,0,.45);border:1px solid #22d3ee;
      font-weight:900;cursor:grab;touch-action:none;display:none;
      align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:8px 4px;
    }
    #yadah-base-tab-arrow{font-size:30px;line-height:.8}
    .yadah-base-tab-label{font-size:.62rem;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px}
    #yadah-base-tab-count{min-width:19px;height:19px;border-radius:10px;background:#dc2626;color:#fff;font-size:.65rem;display:none;align-items:center;justify-content:center}
    #yadah-base-tab.open{right:min(320px,86vw);left:auto;background:rgba(5,7,11,.48)}

    /* ===== PESTAÑA IZQUIERDA: CARRERAS LIBRES (LLAMADAS) ===== */
    #yadah-career-notifications{
      --career-panel-width:min(320px,86vw);
      position:fixed;left:calc(-1 * var(--career-panel-width));top:var(--career-tab-top,40%);transform:translateY(-50%);
      z-index:3925;width:var(--career-panel-width);max-height:48vh;overflow-y:auto;overflow-x:hidden;
      box-sizing:border-box;padding:7px;background:#05070B;border:1px solid #22d3ee;
      border-left:0;border-radius:0 12px 12px 0;box-shadow:8px 8px 24px rgba(0,0,0,.45);
      display:flex;flex-direction:column;gap:5px;transition:left .25s ease;
    }
    #yadah-career-notifications.open{left:0}
    #yadah-career-notifications::before{content:'🚕 CARRERAS LIBRES';display:block;color:#fff;font-weight:900;font-size:.78rem;padding:2px 3px 5px;border-bottom:1px solid #164e63;text-align:left}

    #yadah-career-tab{
      position:fixed;left:0;top:var(--career-tab-top,40%);transform:translateY(-50%);
      z-index:3927;width:48px;min-height:112px;border:0;border-radius:0 12px 12px 0;
      background:rgba(5,7,11,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
      color:#fff;box-shadow:4px 4px 12px rgba(0,0,0,.45);border:1px solid #22d3ee;
      font-weight:900;cursor:grab;touch-action:none;display:none;
      align-items:center;justify-content:center;flex-direction:column;gap:3px;padding:8px 4px;
    }
    #yadah-career-tab-arrow{font-size:30px;line-height:.8}
    .yadah-career-tab-label{font-size:.62rem;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px}
    #yadah-career-tab-count{min-width:19px;height:19px;border-radius:10px;background:#dc2626;color:#fff;font-size:.65rem;display:none;align-items:center;justify-content:center}
    #yadah-career-tab.open{left:min(320px,86vw);background:rgba(5,7,11,.48)}

    #yadah-career-fab{position:absolute;right:12px;bottom:88px;z-index:2700;display:flex;gap:7px;flex-direction:column;align-items:flex-end}
    .yc-btn{border:1px solid #38bdf8;background:#0b1220;color:#e2e8f0;border-radius:10px;padding:9px 11px;font-size:.74rem;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.45);cursor:pointer}
    .yc-btn.primary{background:#0369a1;border-color:#38bdf8;color:#fff}.yc-btn.history{background:#111827}
    #yadah-career-stack{position:absolute;right:12px;left:auto;top:68px;z-index:2650;display:none;flex-direction:column;gap:7px;pointer-events:none;max-height:42vh;overflow:auto}

    #yadah-career-modal{position:fixed;inset:0;z-index:3900;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}
    .yc-modal-card{width:min(520px,100%);background:#111827;border-top:2px solid #38bdf8;border-radius:16px 16px 0 0;padding:16px;max-height:82vh;overflow:auto}
    .yc-modal-title{display:flex;justify-content:space-between;align-items:center;color:#38bdf8;font-weight:900;font-size:.98rem;margin-bottom:10px}.yc-close{cursor:pointer;color:#94a3b8;font-size:1.2rem}
    .yc-input-row{display:flex;gap:8px;align-items:stretch}.yc-input{width:100%;padding:11px 12px;background:#030712;color:#fff;border:1px solid #334155;border-radius:8px;outline:none;font-size:.9rem;min-width:0}.yc-mic{width:48px;min-width:48px;border:1px solid #334155;border-radius:8px;background:#1e293b;color:#e2e8f0;font-size:1.25rem;cursor:pointer}.yc-mic.active{background:#dc2626;border-color:#f87171;animation:ycMicPulse 1s infinite}.yc-mic.unsupported{opacity:.45}.yc-label{font-size:.72rem;color:#94a3b8;margin:8px 0 5px;display:block}.yc-voice-status{font-size:.68rem;color:#38bdf8;min-height:16px;margin-top:5px}.yc-actions{display:flex;gap:8px;margin-top:12px}.yc-actions button{flex:1;padding:10px;border:0;border-radius:8px;font-weight:900;cursor:pointer}.yc-submit{background:#0284c7;color:#fff}.yc-secondary{background:#374151;color:#e2e8f0}@keyframes ycMicPulse{50%{transform:scale(1.04)}}
    #yadah-career-history-list{display:flex;flex-direction:column;gap:7px;max-height:55vh;overflow:auto}.yc-history-item{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:9px 10px}.yc-history-main{font-size:.82rem;font-weight:800;color:#fff}.yc-history-meta{font-size:.68rem;color:#94a3b8;margin-top:3px}
    .yc-empty{color:#64748b;font-size:.8rem;text-align:center;padding:14px}
    @media(min-width:800px){#yadah-career-stack{right:16px;left:auto;width:360px;top:72px;max-height:55vh}#yadah-career-fab{right:18px;bottom:102px}}
  </style>
</head>
<body>

  <audio id="radio-speaker" autoplay playsinline controls style="display:none;"></audio>

  <div id="login-screen">
    <div class="login-header">
      <h1>📻 Yadah Radio Flota</h1>
      <p>Selecciona tu terminal de despacho (Clave requerida)</p>
    </div>
    <div class="grid-units">
      <button class="btn-unit-select modulador" onclick="solicitarAccesoPerfil('Modulador')">
        <span>🏢</span> Modulador / Base Central
      </button>
      <button class="btn-unit-select clientes" onclick="solicitarAccesoPerfil('Clientes')"><span>👥</span> Clientes / Cola de Base</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 01')"><span>🚘</span> Móvil 01</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 02')"><span>🚘</span> Móvil 02</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 03')"><span>🚘</span> Móvil 03</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 04')"><span>🚘</span> Móvil 04</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 05')"><span>🚘</span> Móvil 05</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 06')"><span>🚘</span> Móvil 06</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 07')"><span>🚘</span> Móvil 07</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 08')"><span>🚘</span> Móvil 08</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 09')"><span>🚘</span> Móvil 09</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 10')"><span>🚘</span> Móvil 10</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 11')"><span>🚘</span> Móvil 11</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 12')"><span>🚘</span> Móvil 12</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 13')"><span>🚘</span> Móvil 13</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 14')"><span>🚘</span> Móvil 14</button>
    </div>
  </div>

  <div id="client-tracking-screen" aria-live="polite">
    <div class="cq-header"><div class="cq-brand">👥 Clientes / Cola de Base</div><div class="cq-subtitle">Clientes esperando en la sala</div></div>
    <div id="client-queue-list"></div>
    <button class="cq-logout" type="button" onclick="logoutUnit()">Salir</button>
  </div>

  <header>
    <div class="brand">
      <span>📻</span> Yadah PTT
    </div>
    <div class="header-actions">
      <button class="btn-header" id="btn-toggle-fleet" onclick="toggleFleetDrawer(true)" style="display:none; border-color:#38bdf8; color:#38bdf8;">📋 Flota</button>
      <button class="btn-header" onclick="toggleHistory(true)">📁 Buzón</button>
    </div>
  </header>

  <div id="fleet-summary-bar" onclick="toggleFleetDrawer(true)">
    <span>🏢 <b>Supervisión Flota:</b></span>
    <span><span class="badge-stat online" id="stat-online">0 En línea</span></span>
    <span><span class="badge-stat at-base" id="stat-base">0 En Base</span></span>
    <span><span class="badge-stat stopped" id="stat-stopped">0 Detenidos</span></span>
    <span><span class="badge-stat offline" id="stat-offline">14 Apagados</span></span>
  </div>

  <!-- MAPA PRINCIPAL RESTAURADO -->
  <div id="map-container">
    <div id="map"></div>
    <button class="btn-sos" id="btn-sos" title="Botón de Pánico SOS" onclick="triggerSOS()">🚨</button>
  </div>

  <!-- ===== PESTAÑA IZQUIERDA: CARRERAS LIBRES (LLAMADAS) ===== -->
  <button id="yadah-career-tab" type="button" aria-label="Abrir carreras libres"><span id="yadah-career-tab-arrow">‹</span><span class="yadah-career-tab-label">CARRERAS</span><span id="yadah-career-tab-count">0</span></button>
  <div id="yadah-career-notifications" aria-live="polite" aria-label="Carreras libres"></div>

  <!-- FAB DE CARRERAS -->
  <div id="yadah-career-fab">
    <button class="yc-btn primary" id="yc-new-btn" type="button">🚕 Carrera</button>
    <button class="yc-btn history" id="yc-history-btn" type="button">📋 Carreras</button>
  </div>
  <div id="yadah-career-modal">
    <div class="yc-modal-card" onclick="event.stopPropagation()">
      <div class="yc-modal-title"><span id="yc-modal-title">🚕 Nueva carrera</span><span class="yc-close" id="yc-close">✕</span></div>
      <div id="yc-form-view">
        <label class="yc-label" for="yc-place-input">¿Dónde quieren el carro?</label>
        <div class="yc-input-row"><input class="yc-input" id="yc-place-input" maxlength="120" autocomplete="off" placeholder="Ej.: Tabernáculo de las Conchitas"><button class="yc-mic" id="yc-mic" type="button" title="Hablar carrera" aria-label="Hablar carrera">🎙️</button></div><div class="yc-voice-status" id="yc-voice-status" aria-live="polite"></div>
        <div class="yc-actions"><button class="yc-secondary" id="yc-cancel">Cancelar</button><button class="yc-submit" id="yc-create">Crear carrera</button></div>
      </div>
      <div id="yc-history-view" style="display:none">
        <div id="yadah-career-history-list"></div>
        <div class="yc-actions"><button class="yc-secondary" id="yc-history-close">Cerrar</button></div>
      </div>
    </div>
  </div>

  <!-- ===== PESTAÑA DERECHA: BASE ===== -->
  <button id="yadah-base-tab" type="button" aria-label="Abrir carreras asignadas de base"><span id="yadah-base-tab-arrow">›</span><span class="yadah-base-tab-label">BASE</span><span id="yadah-base-tab-count">0</span></button>
  <div id="yadah-base-notifications" aria-live="polite" aria-label="Carreras asignadas de base"></div>

  <div class="controls-panel">
    <div class="status-bar">
      <span>Unidad: <b style="color:#38bdf8;" id="lbl-unit">--</b></span>
      <span>GPS: <b id="lbl-gps-status" class="status-warning">Comprobando...</b></span>
    </div>
    <div class="channel-status" id="channel-status">● CANAL LIBRE</div>
    <button class="btn-ptt" id="btn-ptt"><span>🎙️</span> PULSAR PARA HABLAR</button>
  </div>

  <script>
    let currentUnit = localStorage.getItem('yadah_terminal_id');
    const loginScreen = document.getElementById('login-screen');
    const lblUnit = document.getElementById('lbl-unit');

    function solicitarAccesoPerfil(id) {
      const pass = prompt(`🔐 Ingrese la contraseña de seguridad para [ ${id} ]:`);
      if (pass === "2021") {
        currentUnit = id;
        localStorage.setItem('yadah_terminal_id', id);
        checkAuth();
      } else if (pass !== null) {
        alert("❌ Contraseña incorrecta.");
      }
    }

    function checkAuth() {
      if (currentUnit) {
        if(loginScreen) loginScreen.style.display = 'none';
        if(lblUnit) lblUnit.textContent = currentUnit;
      } else {
        if(loginScreen) loginScreen.style.display = 'flex';
      }
    }

    // Inicializar Mapa MapLibre
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [-89.3562, 13.7242],
      zoom: 16
    });

    // Control de Pestaña Izquierda (Carreras Libres)
    const careerTab = document.getElementById('yadah-career-tab');
    if(careerTab && !careerTab.dataset.bound){
      careerTab.dataset.bound = '1';
      careerTab.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const box = document.getElementById('yadah-career-notifications');
        if(!box) return;
        const open = !box.classList.contains('open');
        box.classList.toggle('open', open);
        careerTab.classList.toggle('open', open);
        document.getElementById('yadah-career-tab-arrow').textContent = open ? '›' : '‹';
      });
    }

    // Control de Pestaña Derecha (Base)
    const baseTab = document.getElementById('yadah-base-tab');
    if(baseTab && !baseTab.dataset.bound){
      baseTab.dataset.bound = '1';
      baseTab.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const box = document.getElementById('yadah-base-notifications');
        if(!box) return;
        const open = !box.classList.contains('open');
        box.classList.toggle('open', open);
        baseTab.classList.toggle('open', open);
        document.getElementById('yadah-base-tab-arrow').textContent = open ? '‹' : '›';
      });
    }

    if (!localStorage.getItem('yadah_terminal_id')) {
      if(loginScreen) loginScreen.style.display = 'flex';
    } else {
      checkAuth();
    }
  </script>
</body>
</html>
