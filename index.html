  <script>
    /* ===== YADAH DIAGNOSTICO DE ARRANQUE ===== */
    (function () {
      const errores = [];
      let panel = null;

      function textoSeguro(v) {
        try { return String(v ?? ''); } catch (_) { return '(sin detalle)'; }
      }

      function mostrarPanel(titulo, detalle, extra) {
        const root = document.documentElement;
        const body = document.body || root;
        if (!panel) {
          panel = document.createElement('div');
          panel.id = 'yadah-diagnostic-panel';
          panel.style.cssText = [
            'position:fixed','inset:0','z-index:2147483647','display:flex',
            'align-items:center','justify-content:center','padding:16px',
            'background:rgba(3,7,18,.97)','color:#fff','font-family:Arial,sans-serif'
          ].join(';');
          body.appendChild(panel);
        }
        const detalleLimpio = textoSeguro(detalle).slice(0, 5000);
        const extraLimpio = textoSeguro(extra).slice(0, 3000);
        panel.innerHTML = `
          <div style="width:min(720px,100%);max-height:92vh;overflow:auto;background:#111827;border:2px solid #ef4444;border-radius:16px;padding:18px;box-shadow:0 0 30px rgba(239,68,68,.25)">
            <div style="font-size:1.15rem;font-weight:800;color:#f87171;margin-bottom:8px">⚠️ YADAH — ERROR DE ARRANQUE</div>
            <div style="font-size:.9rem;color:#f8fafc;margin-bottom:12px">La aplicación encontró un error antes de poder iniciar correctamente.</div>
            <div style="font-size:.78rem;color:#fca5a5;margin-bottom:5px">${textoSeguro(titulo)}</div>
            <pre style="white-space:pre-wrap;word-break:break-word;background:#020617;border-radius:10px;padding:12px;color:#e2e8f0;font-size:.76rem;line-height:1.45">${detalleLimpio}</pre>
            ${extraLimpio ? `<pre style="white-space:pre-wrap;word-break:break-word;background:#1e293b;border-radius:10px;padding:10px;color:#cbd5e1;font-size:.72rem">${extraLimpio}</pre>` : ''}
            <div style="font-size:.72rem;color:#94a3b8;margin-top:10px">Esta pantalla es temporal y solo sirve para identificar el fallo. No es parte de la versión final.</div>
          </div>`;
      }

      window.__YADAH_DIAGNOSTIC_ERRORS__ = errores;
      window.addEventListener('error', function (e) {
        const msg = e && e.message ? e.message : 'Error de recurso o JavaScript';
        const info = [
          'Mensaje: ' + msg,
          'Archivo: ' + (e && e.filename ? e.filename : '(desconocido)'),
          'Línea: ' + (e && e.lineno ? e.lineno : '?') + ', columna: ' + (e && e.colno ? e.colno : '?')
        ].join('\n');
        errores.push(info);
        mostrarPanel('Error capturado', info, e && e.target && (e.target.src || e.target.href) ? 'Recurso: ' + (e.target.src || e.target.href) : '');
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        const reason = e && e.reason;
        const info = reason && reason.stack ? reason.stack : textoSeguro(reason);
        errores.push('Promise: ' + info);
        mostrarPanel('Error de Promise', info, '');
      });
    })();
  </script>
