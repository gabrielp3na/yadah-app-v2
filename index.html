<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Yadah Radio 3D Flota</title>

  <!-- MapLibre GL JS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <!-- MQTT WebSockets -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #login-screen {
      position: fixed;
      inset: 0;
      background: #0b0f19;
      z-index: 4000;
      display: flex;
      flex-direction: column;
      padding: 20px;
      overflow-y: auto;
    }

    .login-header {
      text-align: center;
      margin-bottom: 16px;
    }

    .login-header h1 {
      color: #38bdf8;
      font-size: 1.4rem;
      margin-bottom: 4px;
    }

    .login-header p {
      color: #94a3b8;
      font-size: 0.85rem;
    }

    .grid-units {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      max-width: 420px;
      margin: 0 auto;
      width: 100%;
      padding-bottom: 30px;
    }

    .btn-unit-select {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 6px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .btn-unit-select.modulador {
      grid-column: span 2;
      background: #1e3a8a;
      border-color: #3b82f6;
      color: #dbeafe;
      font-size: 1rem;
    }

    .btn-unit-select:active {
      background: #38bdf8;
      color: #0b0f19;
    }

    header {
      background-color: #111827;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
      z-index: 1000;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #38bdf8;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      align-items: center;
    }

    .btn-header {
      background: #1f2937;
      border: 1px solid #374151;
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    #map-container {
      flex: 1;
      width: 100%;
      position: relative;
      overflow: hidden;
      background-color: #0f172a;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .btn-sos {
      position: absolute;
      bottom: 20px;
      left: 14px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #dc2626;
      border: 3px solid #f87171;
      color: #ffffff;
      font-size: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(220, 38, 38, 0.7);
      cursor: pointer;
      z-index: 2500;
    }

    .controls-panel {
      background-color: #111827;
      padding: 10px 14px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid #1f2937;
      z-index: 1000;
      flex-shrink: 0;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: #94a3b8;
    }

    .status-active { color: #38bdf8; font-weight: 600; }
    .status-warning { color: #ef4444; font-weight: 700; }

    .channel-status {
      background-color: #030712;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #94a3b8;
      border: 1px solid #1f2937;
    }

    .btn-ptt {
      width: 100%;
      height: 54px;
      background-color: #030712;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      color: #38bdf8;
      font-size: 1rem;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }

    /* ===== ESTILO UNIFICADO (FONDO CELESTE, BOTÓN NEGRO, TEXTOS CELESTES) ===== */
    .yb-notify-card, .yc-card {
      width: 100%; box-sizing: border-box;
      background: rgba(8, 47, 73, 0.90);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      border-radius: 8px; padding: 6px; box-shadow: 0 2px 8px rgba(0,0,0,.3);
      color: #38bdf8; flex: 0 0 auto; transition: all 0.2s ease; border: 1.5px solid #38bdf8;
    }
    .yb-notify-card.pending, .yc-card.pending { border-color: #38bdf8; }
    .yb-notify-card.accepted, .yc-card.done { border-color: #38bdf8; background: rgba(12, 74, 110, 0.95); }
    .yc-card.active { border-color: #f59e0b; background: rgba(28, 20, 5, 0.95); }

    .yb-notify-title, .yc-state { font-weight: 900; color: #38bdf8 !important; font-size: .64rem; line-height: 1.05; }
    .yb-notify-place, .yc-place { font-size: .76rem; font-weight: 900; margin: 3px 0; color: #e0f2fe !important; line-height: 1.05; overflow-wrap: anywhere; }
    .yb-notify-meta, .yc-time { font-size: .54rem; color: #7dd3fc !important; line-height: 1.1; }

    .yb-notify-actions { display: flex; gap: 4px; margin-top: 5px; }
    .yb-notify-actions button, .yb-notify-finish, .yc-card button {
      width: 100%; border: 1px solid #38bdf8 !important; border-radius: 6px; padding: 6px;
      background: #030712 !important; color: #38bdf8 !important; font-weight: 900; font-size: .64rem; min-height: 28px; cursor: pointer;
    }
    .yb-notify-reject, .yc-card button.cancel { background: #030712 !important; color: #94a3b8 !important; border: 1px solid #334155 !important; }

    /* ===== PESTAÑA DERECHA: BASE ===== */
    #yadah-base-notifications{
      --base-panel-width:min(270px,75vw);
      position:fixed;right:calc(-1 * var(--base-panel-width));left:auto;top:var(--base-tab-top,50%);transform:translateY(-50%);
      z-index:3925;width:var(--base-panel-width);max-height:42vh;overflow-y:auto;overflow-x:hidden;
      box-sizing:border-box;padding:5px; background:rgba(5, 7, 11, 0.6); backdrop-filter:blur(6px);
      border:1px solid rgba(56, 189, 248, 0.5); border-right:0; border-radius:10px 0 0 10px; box-shadow:-4px 4px 16px rgba(0,0,0,.4);
      display:flex;flex-direction:column;gap:5px;transition:right .25s ease;
    }
    #yadah-base-notifications.open{right:0;left:auto}
    #yadah-base-notifications::before{content:'🏠 CARRERAS DE BASE';display:block;color:#f8fafc;font-weight:900;font-size:.7rem;padding:2px 2px 4px;border-bottom:1px solid rgba(56, 189, 248, 0.3);text-align:right}
    
    #yadah-base-tab{
      position:fixed;right:0;left:auto;top:var(--base-tab-top,50%);transform:translateY(-50%);
      z-index:3927;width:38px;min-height:90px; border:0; border-radius:10px 0 0 10px;
      background:rgba(11, 15, 25, 0.85); backdrop-filter:blur(5px); color:#f8fafc; box-shadow:-3px 3px 10px rgba(0,0,0,.4);
      border:1px solid rgba(56,189,248,.5); font-weight:900; cursor:grab; touch-action:none; display:none;
      align-items:center; justify-content:center; flex-direction:column; gap:2px; padding:6px 2px;
    }
    #yadah-base-tab-arrow{font-size:22px;line-height:.8}
    .yadah-base-tab-label{font-size:.54rem;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px}
    #yadah-base-tab-count{min-width:16px;height:16px;border-radius:8px;background:#dc2626;color:#fff;font-size:.55rem;display:none;align-items:center;justify-content:center}
    #yadah-base-tab.open{right:min(270px,75vw);left:auto;background:rgba(11, 15, 25, 0.75)}

    /* ===== PESTAÑA IZQUIERDA: CARRERAS LIBRES (LLAMADAS) ===== */
    #yadah-career-notifications{
      --career-panel-width:min(270px,75vw);
      position:fixed;left:calc(-1 * var(--career-panel-width));top:var(--career-tab-top,50%);transform:translateY(-50%);
      z-index:3925;width:var(--career-panel-width);max-height:42vh;overflow-y:auto;overflow-x:hidden;
      box-sizing:border-box;padding:5px; background:rgba(5, 7, 11, 0.6); backdrop-filter:blur(6px);
      border:1px solid rgba(56, 189, 248, 0.5); border-left:0; border-radius:0 10px 10px 0; box-shadow:4px 4px 16px rgba(0,0,0,.4);
      display:flex;flex-direction:column;gap:5px;transition:left .25s ease;
    }
    #yadah-career-notifications.open{left:0}
    #yadah-career-notifications::before{content:'🚕 CARRERAS LIBRES';display:block;color:#f8fafc;font-weight:900;font-size:.7rem;padding:2px 2px 4px;border-bottom:1px solid rgba(56, 189, 248, 0.3);text-align:left}
    
    #yadah-career-tab{
      position:fixed;left:0;top:var(--career-tab-top,50%);transform:translateY(-50%);
      z-index:3927;width:38px;min-height:90px; border:0; border-radius:0 10px 10px 0px;
      background:rgba(11, 15, 25, 0.85); backdrop-filter:blur(5px); color:#f8fafc; box-shadow:3px 3px 10px rgba(0,0,0,.4);
      border:1px solid rgba(56,189,248,.5); font-weight:900; cursor:grab; touch-action:none; display:none;
      align-items:center; justify-content:center; flex-direction:column; gap:2px; padding:6px 2px;
    }
    #yadah-career-tab-arrow{font-size:22px;line-height:.8}
    .yadah-career-tab-label{font-size:.54rem;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.5px}
    #yadah-career-tab-count{min-width:16px;height:16px;border-radius:8px;background:#dc2626;color:#fff;font-size:.55rem;display:none;align-items:center;justify-content:center}
    #yadah-career-tab.open{left:min(270px,75vw);background:rgba(11, 15, 25, 0.75)}
  </style>
</head>
<body>

  <audio id="radio-speaker" autoplay playsinline controls style="display:none;"></audio>

  <div id="login-screen">
    <div class="login-header">
      <h1>📻 Yadah Radio Flota</h1>
      <p>Selecciona tu terminal de despacho (Clave requerida)</p>
    </div>
    <div class="grid-units">
      <button class="btn-unit-select modulador" onclick="solicitarAccesoPerfil('Modulador')"><span>🏢</span> Modulador / Base Central</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 01')"><span>🚘</span> Móvil 01</button>
      <button class="btn-unit-select" onclick="solicitarAccesoPerfil('Móvil 02')"><span>🚘</span> Móvil 02</button>
    </div>
  </div>

  <header>
    <div class="brand"><span>📻</span> Yadah PTT</div>
  </header>

  <!-- MAPA PRINCIPAL RESTAURADO -->
  <div id="map-container">
    <div id="map"></div>
    <button class="btn-sos" id="btn-sos" title="Botón de Pánico SOS">🚨</button>
  </div>

  <!-- PESTAÑA IZQUIERDA: CARRERAS LIBRES (LLAMADAS) -->
  <button id="yadah-career-tab" type="button"><span id="yadah-career-tab-arrow">›</span><span class="yadah-career-tab-label">CARRERAS</span><span id="yadah-career-tab-count">0</span></button>
  <div id="yadah-career-notifications"></div>

  <!-- PESTAÑA DERECHA: BASE -->
  <button id="yadah-base-tab" type="button"><span id="yadah-base-tab-arrow">›</span><span class="yadah-base-tab-label">BASE</span><span id="yadah-base-tab-count">0</span></button>
  <div id="yadah-base-notifications"></div>

  <div class="controls-panel">
    <div class="status-bar">
      <span>Unidad: <b style="color:#38bdf8;" id="lbl-unit">--</b></span>
      <span>GPS: <b id="lbl-gps-status" class="status-warning">Comprobando...</b></span>
    </div>
    <div class="channel-status" id="channel-status">● CANAL LIBRE</div>
    <button class="btn-ptt" id="btn-ptt"><span>🎙️</span> PULSAR PARA HABLAR</button>
  </div>

  <script>
    let currentUnit = localStorage.getItem('yadah_terminal_id');
    const loginScreen = document.getElementById('login-screen');
    const lblUnit = document.getElementById('lbl-unit');

    function solicitarAccesoPerfil(id) {
      const pass = prompt(`🔐 Ingrese la contraseña de seguridad para [ ${id} ]:`);
      if (pass === "2021") {
        currentUnit = id;
        localStorage.setItem('yadah_terminal_id', id);
        checkAuth();
      } else if (pass !== null) {
        alert("❌ Contraseña incorrecta.");
      }
    }

    function checkAuth() {
      if (currentUnit) {
        if(loginScreen) loginScreen.style.display = 'none';
        if(lblUnit) lblUnit.textContent = currentUnit;
      } else {
        if(loginScreen) loginScreen.style.display = 'flex';
      }
    }

    // Inicializar Mapa MapLibre
    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [-89.3562, 13.7242],
      zoom: 16
    });

    // Control de Pestaña Izquierda (Carreras Libres)
    const careerTab = document.getElementById('yadah-career-tab');
    if(careerTab){
      careerTab.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const box = document.getElementById('yadah-career-notifications');
        if(!box) return;
        const open = !box.classList.contains('open');
        box.classList.toggle('open', open);
        careerTab.classList.toggle('open', open);
        document.getElementById('yadah-career-tab-arrow').textContent = open ? '‹' : '›';
      });
    }

    // Control de Pestaña Derecha (Base)
    const baseTab = document.getElementById('yadah-base-tab');
    if(baseTab){
      baseTab.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        const box = document.getElementById('yadah-base-notifications');
        if(!box) return;
        const open = !box.classList.contains('open');
        box.classList.toggle('open', open);
        baseTab.classList.toggle('open', open);
        document.getElementById('yadah-base-tab-arrow').textContent = open ? '›' : '‹';
      });
    }

    if (!localStorage.getItem('yadah_terminal_id')) {
      if(loginScreen) loginScreen.style.display = 'flex';
    } else {
      checkAuth();
    }
  </script>
</body>
</html>
